<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndieCrafts Workshops</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: #c2a37d;
            color: #2e1d0e;
            text-align: center;
        }

        .banner {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('background-image.jpg') no-repeat center center/cover;
            padding: 60px 20px;
            color: white;
            font-size: 32px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .workshop-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px;
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .workshop-box {
            background: #f3e2c5;
            border-radius: 12px;
            padding: 20px; 
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 400px;
        }
        
        .workshop-box:hover {
            transform: scale(1.05);
            box-shadow: 8px 8px 20px rgba(0, 0, 0, 0.3);
        }

        .cta-button {
            display: inline-block;
            background: #2e1d0e;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 10px;
            cursor: pointer;
        }

        .cta-button:hover {
            background: #4a3320;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background: #f3e2c5;
            padding: 20px;
            border-radius: 12px;
            max-width: 400px;
            margin: 10% auto;
            text-align: left;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .close {
            float: right;
            font-size: 24px;
            cursor: pointer;
        }

        .modal input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .modal button {
            width: 100%;
            background: #2e1d0e;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #f3e2c5;
        padding: 15px 30px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
    }

    .logo {
        font-size: 24px;
        font-weight: bold;
        color: #5a3d2b;
    }

    .nav-links {
        list-style: none;
        display: flex;
        gap: 20px;
        margin: 0;
        padding: 0;
    }

    .nav-links li {
        display: inline;
    }

    .nav-links a {
        text-decoration: none;
        color: #5a3d2b;
        font-weight: 600;
        transition: color 0.3s ease;
    }

    .nav-links a:hover {
        color: #774936;
    }

    .search-container {
        display: flex;
        align-items: center;
        background: #fff;
        padding: 5px 10px;
        border-radius: 10px;
    }

    .search-container input {
        border: none;
        background: transparent;
        font-size: 16px;
        padding: 5px;
        outline: none;
    }

    .search-container button {
        background: transparent;
        border: none;
        cursor: pointer;
        font-size: 18px;
        color: #5a3d2b;
    }
