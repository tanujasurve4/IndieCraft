<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #c2a37d;
            margin: 0;
            padding: 0;
            color: #2e1d0e;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f3e2c5;
            padding: 15px 30px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }
        .nav-links a {
            text-decoration: none;
            color: #5a3d2b;
            margin: 0 15px;
            font-weight: bold;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            max-width: 900px;
            margin: 40px auto;
            background: #f3e2c5;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
        }
        .image-container {
            flex: 1;
            text-align: center;
        }
        .product-image {
            width: 100%;
            max-width: 300px;
            border-radius: 10px;
            transition: transform 0.3s;
        }
        .image-container:hover .product-image {
            transform: scale(1.1);
        }
        .product-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .product-details h1 {
            font-size: 24px;
            color: #774936;
        }
        .rating {
            color: gold;
            font-size: 20px;
        }
        .reviews {
            font-size: 14px;
            color: gray;
        }
        .button {
            background: #774936;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .button:hover {
            background: #5a3d2b;
        }
        .navbar {   
          display: flex;
          align-items: center;
          justify-content: space-between;
          background: #f3e2c5;
          padding: 15px 30px;
          box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
      }

      .logo {
          font-size: 24px;
          font-weight: bold;
          color: #5a3d2b;
      }

      .nav-links {
          list-style: none;
          display: flex;
          gap: 20px;
          margin: 0;
          padding: 0;
      }

      .nav-links li {
          display: inline;
      }

      .nav-links a {
          text-decoration: none;
          color: #5a3d2b;
          font-weight: 600;
          transition: color 0.3s ease;
      }

      .nav-links a:hover {
          color: #774936;
      }

      .search-container {
          display: flex;
          align-items: center;
          background: #fff;
          padding: 5px 10px;
          border-radius: 10px;
      }

      .search-container input {
          border: none;
          background: transparent;
          font-size: 16px;
          padding: 5px;
          outline: none;
      }

      .search-container button {
          background: transparent;
          border: none;
          cursor: pointer;
          font-size: 18px;
          color: #5a3d2b;
      }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            IndieCrafts              
        </div>
        <h2 id="welcomeMessage"></h2>
        <ul class="nav-links">
            <li><a href="homepage.html">Home</a></li>
            <li><a href="explorelist.html">Shop Now</a></li>
        </ul>
        <div class="search-container">
            <input type="text" placeholder="Search Handicrafts...">
            <button>&#128269;</button>
        </div>
    </nav>
    
    <div class="container">
        <div class="image-container">
            <img id="productImage" alt="Product Image" class="product-image">
        </div>
        <div class="product-details">
            <h1 id="productName"></h1>
            <p><strong>Sold By:</strong> <span id="productMadeBy"></span></p>
            <p><strong>Price:</strong> <span id="productPrice" style="color: red;"></span></p>
            <div class="rating">★★★★★ 4.5/5.0</div>
            <p class="reviews">10 Reviews</p>
            <p id="productDescription"></p>
            
            <button class="button add-to-cart">ADD TO CART</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get("id");
            let product = null;
            
            // Check if it's a default product or a custom one
            if (productId === "1" || productId === "2") {
                // It's one of the default products
                const defaultProducts = JSON.parse(localStorage.getItem("defaultProducts")) || [];
                product = defaultProducts.find(p => p.id == productId);
            } else if (productId && productId.startsWith("custom_")) {
                // It's a custom product
                const index = parseInt(productId.replace("custom_", ""));
                const products = JSON.parse(localStorage.getItem("products")) || [];
                product = products[index];
            }
    
            if (product && product.name && product.image) {
                let productImage = document.getElementById("productImage");
    
                productImage.src = product.image;
                productImage.onerror = function () {
                    this.onerror = null;
                    this.src = 'placeholder.jpg';
                };
    
                document.getElementById("productName").textContent = product.name;
                document.getElementById("productMadeBy").textContent = product.madeBy || "Unknown";
                document.getElementById("productPrice").textContent = "₹" + product.price;
                document.getElementById("productDescription").textContent = product.description || "No description available";
    
                document.querySelector(".add-to-cart").addEventListener("click", function () {
                    let cart = JSON.parse(localStorage.getItem("cart")) || [];
                    cart.push(product);
                    localStorage.setItem("cart", JSON.stringify(cart));
                    window.location.href = "cart.html";
                });
            } else {
                document.querySelector(".container").innerHTML = "<p>Product not found.</p>";
            }
        });
    </script>
</body>
</html>
