<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell Product</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #c2a37d;
            margin: 0;
            padding: 0;
            color: #2e1d0e;
        }
        .header {
            background: #5a3d2b;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #f3e2c5;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
        }
        label {
            font-weight: bold;
        }
        input, select, textarea {
            width: 97%;
            padding: 8px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #5a3d2b;
        }
        button {
            width: 100%;
            background: #5a3d2b;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        #imagePreview {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            margin-top: 10px;
            display: none;
        }
        .navbar {   
          display: flex;
          align-items: center;
          justify-content: space-between;
          background: #f3e2c5;
          padding: 15px 30px;
          box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #5a3d2b;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .nav-links li {
            display: inline;
        }

        .nav-links a {
            text-decoration: none;
            color: #5a3d2b;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #774936;
        }

        .search-container {
            height: 40px;
            display: flex;
            align-items: center;
            background: #fff;
            padding: 5px 10px;
            border-radius: 10px;
        }

        .search-container input {
            border: none;
            background: transparent;
            font-size: 16px;
            padding: 5px;
            outline: none;
        }

        .search-container button {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #5a3d2b;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            IndieCrafts              
        </div>
        <h2 id="welcomeMessage"></h2>
        <ul class="nav-links">
            <li><a href="homepage.html">Home</a></li>
            <li><a href="explorelist.html">Shop Now</a></li>
        </ul>
        <div class="search-container">
            <input type="text" placeholder="Search Handicrafts...">
            <button>&#128269;</button>
        </div>
    </nav>
<div class="header">Sell Your Product</div>

<div class="container">
    <form id="sellForm">
        <!-- Product Name -->
        <label for="name">Product Name:</label>
        <input type="text" id="name" required>
        
        <!-- Category Selection -->
        <label for="category">Category:</label>
        <select id="category">
            <option value="bags">Bags</option>
            <option value="clothes">Clothes</option>
            <option value="craft">Craft</option>
            <option value="new">New Category</option>
        </select>
        
        <label for="newCategory" id="newCategoryLabel" style="display: none;">New Category Name:</label>
        <input type="text" id="newCategory" style="display: none;">
        
        <!-- Made By -->
        <label for="madeBy">Made By:</label>
        <input type="text" id="madeBy" required>

        <!-- Price -->
        <label for="price">Price:</label>
        <input type="number" id="price" required>
        
        <!-- Description -->
        <label for="description">Description:</label>
        <textarea id="description" rows="4" required></textarea>

        <!-- Image Upload Section -->
        <label for="imageUpload">Upload Product Image:</label>
        <input type="file" id="imageUpload" accept="image/*" required>

        <img id="imagePreview">

        <!-- Submit Button -->
        <button type="submit">Add Product</button>
    </form>
</div>

<script>
    // Toggle New Category Input visibility
    document.getElementById("category").addEventListener("change", function() {
        const newCategoryInput = document.getElementById("newCategory");
        const newCategoryLabel = document.getElementById("newCategoryLabel");
        
        if (this.value === "new") {
            // Show new category input
            newCategoryInput.style.display = "block";
            newCategoryLabel.style.display = "block";
        } else {
            // Hide new category input
            newCategoryInput.style.display = "none";
            newCategoryLabel.style.display = "none";
        }
    });

    // Handle image upload and preview
    document.getElementById("imageUpload").addEventListener("change", function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById("imagePreview").src = e.target.result;
                document.getElementById("imagePreview").style.display = "block";
            };
            reader.readAsDataURL(file);
        }
    });

    // Handle form submission and data storage
    document.getElementById("sellForm").addEventListener("submit", function(event) {
        event.preventDefault();

        let productName = document.getElementById("name").value;
        let category = document.getElementById("category").value;
        let newCategory = document.getElementById("newCategory").value;
        let madeBy = document.getElementById("madeBy").value;
        let price = document.getElementById("price").value;
        let description = document.getElementById("description").value;
        let image = "";

        if (category === "new" && newCategory.trim() !== "") {
            category = newCategory.toLowerCase().replace(/\s+/g, "-");
        }

        let imageFile = document.getElementById("imageUpload").files[0];
        if (imageFile) {
            let reader = new FileReader();
            reader.onload = function(e) {
                image = e.target.result;
                saveProduct();
            };
            reader.readAsDataURL(imageFile);
        } else {
            alert("Please select an image to upload.");
        }

        function saveProduct() {
            let products = JSON.parse(localStorage.getItem("products")) || [];

            // Assign unique ID to product
            let newProduct = {
                id: Date.now(), // UNIQUE ID
                name: productName,
                category,
                madeBy,
                price,
                description,
                image
            };

            products.push(newProduct);
            localStorage.setItem("products", JSON.stringify(products));

            window.location.href = "explorelist.html";
        }
    });
</script>
</body>
</html>
