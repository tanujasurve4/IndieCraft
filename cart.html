<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #c2a37d; color: #2e1d0e; margin: 0; padding: 0; }
        .navbar {   
          display: flex;
          align-items: center;
          justify-content: space-between;
          background: #f3e2c5;
          padding: 15px 30px;
          box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #5a3d2b;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .nav-links li {
            display: inline;
        }

        .nav-links a {
            text-decoration: none;
            color: #5a3d2b;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #774936;
        }

        .search-container {
            display: flex;
            align-items: center;
            background: #fff;
            padding: 5px 10px;
            border-radius: 10px;
        }

        .search-container input {
            border: none;
            background: transparent;
            font-size: 16px;
            padding: 5px;
            outline: none;
        }

        .search-container button {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #5a3d2b;
        }
        
        .cart-container { max-width: 600px; margin: 40px auto; background: #f3e2c5; padding: 20px; border-radius: 10px; box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2); }
        .cart-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; padding: 10px; background: #e0c7a4; border-radius: 8px; }
        .cart-item img { width: 80px; border-radius: 8px; }
        .cart-info { flex: 1; }
        .button { background: #774936; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        .button:hover { background: #5a3d2b; }
        .remove-button { background: #d9534f; } 
        .remove-button:hover { background: #c9302c; }
        
        /* Debug Section */
        .debug-section { 
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none; /* Hidden by default */
        }
        .debug-title {
            color: #343a40;
            margin-top: 0;
        }
        .debug-button {
            background: #343a40;
            color: white;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            IndieCrafts              
        </div>
        <h2 id="welcomeMessage"></h2>
        <ul class="nav-links">
            <li><a href="homepage.html">Home</a></li>
            <li><a href="explorelist.html">Shop Now</a></li>
        </ul>
        <div class="search-container">
            <input type="text" placeholder="Search Handicrafts...">
            <button>&#128269;</button>
        </div>
    </nav>
    
    <div class="cart-container">
        <h2>Your Cart</h2>
        <div id="cart-items"></div>
        <h3>Total: ₹<span id="total-price">0</span></h3>
        <button class="button" onclick="checkout()">BUY NOW</button>
        <button class="button remove-button" onclick="clearCart()">CLEAR CART</button>
    </div>

    <script>
        // Toggle debug section visibility
        function toggleDebugSection() {
            const debugSection = document.getElementById('debug-section');
            if (debugSection.style.display === 'none' || !debugSection.style.display) {
                debugSection.style.display = 'block';
            } else {
                debugSection.style.display = 'none';
            }
        }
        
        // Show localStorage contents
        function toggleLocalStorageDisplay() {
            const contentDiv = document.getElementById('localStorage-content');
            if (contentDiv.innerHTML === '') {
                let content = '<h4>localStorage Contents:</h4>';
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    content += `<p><strong>${key}:</strong> ${localStorage.getItem(key)}</p>`;
                }
                contentDiv.innerHTML = content;
            } else {
                contentDiv.innerHTML = '';
            }
        }
        
        
        // Add to cart function
        function addToCart(productData) {
            try {
                // Get current cart or initialize empty array
                let cart;
                try {
                    const cartStr = localStorage.getItem("cart");
                    cart = cartStr ? JSON.parse(cartStr) : [];
                    if (!Array.isArray(cart)) cart = [];
                } catch (e) {
                    console.error("Error parsing cart from localStorage:", e);
                    cart = [];
                }
                
                // Check if product is already in cart
                let existingProductIndex = -1;
                if (productData.id) {
                    existingProductIndex = cart.findIndex(item => item.id === productData.id);
                }
                
                if (existingProductIndex >= 0) {
                    // Product already exists in cart
                    alert("This item is already in your cart!");
                } else {
                    // Add new product to cart
                    cart.push({
                        id: productData.id || `product-${Date.now()}`,
                        name: productData.name,
                        price: productData.price,
                        image: productData.image || 'https://via.placeholder.com/80'
                    });
                    
                    // Save updated cart to localStorage
                    localStorage.setItem("cart", JSON.stringify(cart));
                    
                    // Notify user
                    alert("Product added to cart successfully!");
                    
                    // Reload cart display
                    loadCart();
                }
            } catch (e) {
                console.error("Error in addToCart:", e);
                alert("Error adding product to cart: " + e.message);
            }
        }

        // Load cart contents
        function loadCart() {
            try {
                let cart;
                try {
                    const cartStr = localStorage.getItem("cart");
                    cart = cartStr ? JSON.parse(cartStr) : [];
                    if (!Array.isArray(cart)) cart = [];
                } catch (e) {
                    console.error("Error parsing cart from localStorage:", e);
                    cart = [];
                }
                
                let cartItemsContainer = document.getElementById("cart-items");
                let totalPrice = 0;
                cartItemsContainer.innerHTML = "";

                if (cart.length === 0) {
                    cartItemsContainer.innerHTML = "<p>Your cart is empty.</p>";
                } else {
                    cart.forEach((item, index) => {
                        // Handle price correctly regardless of format
                        let itemPrice;
                        if (typeof item.price === 'number') {
                            itemPrice = item.price;
                        } else if (typeof item.price === 'string') {
                            // Remove currency symbols, commas, and spaces
                            const priceStr = item.price.replace(/[^\d.]/g, '');
                            itemPrice = parseFloat(priceStr);
                        } else {
                            itemPrice = 0;
                        }
                        
                        // Add to total if valid
                        if (!isNaN(itemPrice)) {
                            totalPrice += itemPrice;
                        }
                        
                        // Display the item
                        cartItemsContainer.innerHTML += `
                            <div class="cart-item">
                                <div class="cart-info">
                                    <p><strong>${item.name || 'Unknown Product'}</strong></p>
                                    <p>Price: ₹${item.price || '0'}</p>
                                </div>
                                <img src="${item.image || 'https://via.placeholder.com/80'}" alt="${item.name || 'Product'}">
                                <button class="button remove-button" onclick="removeItem(${index})">REMOVE</button>
                            </div>
                        `;
                    });
                }

                // Display the total
                document.getElementById("total-price").innerText = totalPrice.toFixed(0);
                localStorage.setItem("totalPrice", totalPrice.toString());
            } catch (e) {
                console.error("Error in loadCart:", e);
                document.getElementById("cart-items").innerHTML = 
                    `<p>Error loading cart: ${e.message}</p>
                     <p>Try clearing your cart using the button below.</p>`;
            }
        }

        // Remove item from cart
        function removeItem(index) {
            try {
                let cart;
                try {
                    const cartStr = localStorage.getItem("cart");
                    cart = cartStr ? JSON.parse(cartStr) : [];
                    if (!Array.isArray(cart)) cart = [];
                } catch (e) {
                    console.error("Error parsing cart from localStorage:", e);
                    cart = [];
                }
                
                if (index >= 0 && index < cart.length) {
                    cart.splice(index, 1);
                    localStorage.setItem("cart", JSON.stringify(cart));
                    loadCart();
                }
            } catch (e) {
                console.error("Error in removeItem:", e);
                alert("Error removing item: " + e.message);
            }
        }

        // Clear the entire cart
        function clearCart() {
            try {
                localStorage.removeItem("cart");
                localStorage.removeItem("totalPrice");
                loadCart();
                alert("Cart cleared successfully!");
            } catch (e) {
                console.error("Error in clearCart:", e);
                alert("Error clearing cart: " + e.message);
            }
        }

        // Checkout function
        function checkout() {
            try {
                let total = document.getElementById("total-price").innerText;
                if (parseInt(total) === 0) {
                    alert("Your cart is empty!");
                    return;
                }
                localStorage.setItem("totalPrice", total);
                window.location.href = "checkout.html";
            } catch (e) {
                console.error("Error in checkout:", e);
                alert("Error during checkout: " + e.message);
            }
        }

        // Load cart when page loads
        window.onload = function() {
            try {
                loadCart();
            } catch (e) {
                console.error("Error during initial cart load:", e);
                document.getElementById("cart-items").innerHTML = 
                    `<p>Error loading cart: ${e.message}</p>
                     <p>Try clearing your cart using the button below.</p>`;
            }
        };
    </script>
</body>
</html>
