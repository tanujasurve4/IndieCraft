<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | IndieCrafts</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: #c2a37d;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background-color: #f3e2c5;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .profile-icon {
            font-size: 30px;
            background: #774936;
            color: white;
            padding: 10px;
            border-radius: 50%;
        }

        .card {
            background: #f8e9cc;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.2);
        }

        h1, h2 {
            text-align: center;
            color: #5a3d2b;
        }

        .input-group {
            margin-bottom: 12px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
            color: #5a3d2b;
        }

        input, textarea, select {
            width: 95%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
        }

        textarea {
            resize: none;
            height: 80px;
        }

        .submit-btn {
            display: block;
            width: 100%;
            background: #774936;
            color: white;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }

        .submit-btn:hover {
            background: #5a3d2b;
        }
        
        .submit-btn:disabled {
            background: #a89385;
            cursor: not-allowed;
        }

        .clear-btn {
            display: block;
            width: 100%;
            background: #b88b5b;
            color: white;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .clear-btn:hover {
            background: #9b6a46;
        }

        .preview-img-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 4px rgba(0,0,0,0.2);
            margin: 10px 5px;
        }

        .preview-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 0 0 0 8px;
            cursor: pointer;
            padding: 2px 6px;
            font-size: 14px;
        }
        
        .navbar {   
          display: flex;
          align-items: center;
          justify-content: space-between;
          background: #f3e2c5;
          padding: 15px 30px;
          box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #5a3d2b;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .nav-links li {
            display: inline;
        }

        .nav-links a {
            text-decoration: none;
            color: #5a3d2b;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #774936;
        }
        
        .auth-section {
            background: #f8e9cc;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.2);
        }
        
        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 5px;
        }
        
        .success-message {
            color: #388e3c;
            font-size: 14px;
            margin-top: 5px;
        }

        .user-type-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .user-type-btn {
            padding: 10px 20px;
            background: #f3e2c5;
            border: 2px solid #774936;
            border-radius: 6px;
            color: #5a3d2b;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .user-type-btn.active {
            background: #774936;
            color: white;
        }

        .artisan-fields {
            display: none;
        }
        
        .spinner {
            display: none;
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border-left-color: #774936;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }
        
        .progress-container {
            width: 100%;
            background-color: #e0d4b7;
            border-radius: 10px;
            margin: 10px 0;
            overflow: hidden;
            height: 15px;
        }
        
        .progress-bar {
            height: 15px;
            background-color: #774936;
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }
        
        .file-size-warning {
            font-size: 12px;
            color: #d32f2f;
            display: none;
            margin-top: 5px;
        }
        
        .section-divider {
            border-top: 2px dashed #b88b5b;
            margin: 25px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Profile Details</h1>
        <div class="profile-icon">&#128100;</div>
    </header>

    <!-- Account Creation Section -->
    <div class="card" id="authSection">
        <h2>Create Account</h2>
        
        <div class="user-type-selector">
            <button id="regularUserBtn" class="user-type-btn active">Regular User</button>
            <button id="artisanBtn" class="user-type-btn">Artisan</button>
        </div>
        
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="signupEmail" placeholder="Enter your email">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="signupPassword" placeholder="Create a password">
        </div>
        <div class="input-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm your password">
        </div>
        <div id="authMessage" class="error-message"></div>
        
        <p style="text-align: center; margin-top: 10px;">
            Already have an account? <a href="login.html" style="color: #774936;">Log in</a>
        </p>
    </div>

    <div class="section-divider"></div>

    <!-- Personal Information Section -->
    <div class="card" id="personalInfoSection">
        <h2>Personal Information</h2>
        <form id="profileForm">
            <div class="input-group">
                <label>Name</label>
                <input type="text" id="name" placeholder="Enter your name">
            </div>
            <div class="input-group">
                <label>Location</label>
                <select id="locationSelect">
                    <option value="">-- Select Location --</option>
                    <option value="Pune">Pune</option>
                    <option value="Mumbai">Mumbai</option>
                    <option value="Bangalore">Bangalore</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Other">Other</option>
                </select>
                <input type="text" id="customLocation" placeholder="Enter your location" style="margin-top: 10px; display: none;">
            </div>            
        </form>
    </div>

    <!-- Artisan Details Section -->
    <div class="card" id="artisanFields">
        <h2>Artisan Details</h2>
        <div class="input-group">
            <label>Shop Name</label>
            <input type="text" id="shopName" placeholder="Enter your shop name">
        </div>
        <div class="input-group">
            <label>Craft Type</label>
            <input type="text" id="craftType" placeholder="Describe your craft">
        </div>
        <div class="input-group">
            <label>Upload Portfolio Images (Max 3)</label>
            <input type="file" id="portfolioImages" accept="image/*" multiple>
            <div class="file-size-warning" id="fileSizeWarning">File size exceeds 5MB limit!</div>
            <div id="previewContainer" style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;"></div>
        </div>
        <div id="uploadProgress" class="progress-container" style="display: none;">
            <div id="uploadProgressBar" class="progress-bar"></div>
        </div>
    </div>

    <button class="submit-btn" id="signupButton">Create Account & Save Profile</button>
    <div class="loading-container">
        <div id="authSpinner" class="spinner"></div>
    </div>
    <button class="clear-btn" id="clearProfile">Clear All</button>
</div>

<script>
// Wait for DOM to be fully loaded
document.addEventListener("DOMContentLoaded", function() {
    // Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyA6kw7myRgebBFJY01ccjlYC7IVfesUzm0",
        authDomain: "techproject-f749d.firebaseapp.com",
        projectId: "techproject-f749d",
        storageBucket: "techproject-f749d.appspot.com",
        messagingSenderId: "318910876949",
        appId: "1:318910876949:web:a1b2c3d4e5f6"
    };
    
    // Initialize Firebase
    try {
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const db = firebase.firestore();
        const auth = firebase.auth();
        const storage = firebase.storage();
        
        // DOM elements
        const previewContainer = document.getElementById("previewContainer");
        const fileInput = document.getElementById("portfolioImages");
        const locationSelect = document.getElementById("locationSelect");
        const customLocation = document.getElementById("customLocation");
        const signupButton = document.getElementById("signupButton");
        const authMessage = document.getElementById("authMessage");
        const regularUserBtn = document.getElementById("regularUserBtn");
        const artisanBtn = document.getElementById("artisanBtn");
        const artisanFields = document.getElementById("artisanFields");
        const authSpinner = document.getElementById("authSpinner");
        const authSection = document.getElementById("authSection");
        const personalInfoSection = document.getElementById("personalInfoSection");
        const clearProfileBtn = document.getElementById("clearProfile");
        const fileSizeWarning = document.getElementById("fileSizeWarning");
        const uploadProgress = document.getElementById("uploadProgress");
        const uploadProgressBar = document.getElementById("uploadProgressBar");
        
        let isArtisan = false;
        let selectedImages = [];
        let userCreated = false;
        
        console.log("Firebase initialized successfully");
        
        // User type selector functionality
        regularUserBtn.addEventListener("click", function() {
            regularUserBtn.classList.add("active");
            artisanBtn.classList.remove("active");
            isArtisan = false;
            artisanFields.style.display = "none";
        });
        
        artisanBtn.addEventListener("click", function() {
            artisanBtn.classList.add("active");
            regularUserBtn.classList.remove("active");
            isArtisan = true;
            artisanFields.style.display = "block";
        });
        
        // Check authentication state
        auth.onAuthStateChanged(user => {
            if (user && userCreated) {
                console.log("User is signed in:", user.email);
                // Load user profile data if it exists
                loadUserProfile(user.uid);
            } else {
                console.log("No user is signed in or new session");
            }
        });

        // Location selection handler
        locationSelect.addEventListener("change", function() {
            customLocation.style.display = locationSelect.value === "Other" ? "block" : "none";
        });

        function getFinalLocation() {
            return locationSelect.value === "Other" ? customLocation.value.trim() : locationSelect.value;
        }

        // Image upload handlers
        fileInput.addEventListener("change", function() {
            const files = Array.from(fileInput.files);
            
            // Check total image count
            if ((selectedImages.length + files.length) > 3) {
                alert("You can upload a maximum of 3 images.");
                fileInput.value = '';
                return;
            }
            
            // Display file size warning if needed
            let showSizeWarning = false;
            
            files.forEach(file => {
                if (file.size > 5 * 1024 * 1024) { // 5MB limit
                    showSizeWarning = true;
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedImages.push({
                        dataUrl: e.target.result,
                        name: file.name,
                        type: file.type,
                        size: file.size
                    });
                    renderPreviews();
                };
                reader.readAsDataURL(file);
            });
            
            // Show size warning if any file is too large
            if (showSizeWarning) {
                fileSizeWarning.style.display = "block";
                setTimeout(() => {
                    fileSizeWarning.style.display = "none";
                }, 5000);
            }
            
            fileInput.value = '';
        });

        function renderPreviews() {
            previewContainer.innerHTML = '';
            selectedImages.forEach((img, index) => {
                const wrapper = document.createElement("div");
                wrapper.className = "preview-img-wrapper";
                const image = document.createElement("img");
                image.src = img.dataUrl || img;
                const removeBtn = document.createElement("button");
                removeBtn.className = "remove-btn";
                removeBtn.innerText = "×";
                removeBtn.onclick = function() {
                    selectedImages.splice(index, 1);
                    renderPreviews();
                };
                wrapper.appendChild(image);
                wrapper.appendChild(removeBtn);
                previewContainer.appendChild(wrapper);
            });
        }
        
        // Load user profile from Firestore
        function loadUserProfile(userId) {
            db.collection("userProfiles").doc(userId).get()
                .then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        
                        // Set user type selection
                        if (data.userType === "artisan") {
                            isArtisan = true;
                            artisanBtn.classList.add("active");
                            regularUserBtn.classList.remove("active");
                            artisanFields.style.display = "block";
                        } else {
                            isArtisan = false;
                            regularUserBtn.classList.add("active");
                            artisanBtn.classList.remove("active");
                            artisanFields.style.display = "none";
                        }
                        
                        // Set form values
                        document.getElementById("name").value = data.name || '';
                        
                        // Set location
                        const locations = ["Pune", "Mumbai", "Bangalore", "Delhi"];
                        if (locations.includes(data.location)) {
                            locationSelect.value = data.location;
                            customLocation.style.display = 'none';
                        } else if (data.location) {
                            locationSelect.value = "Other";
                            customLocation.style.display = 'block';
                            customLocation.value = data.location;
                        }
                        
                        // Set artisan fields if applicable
                        if (data.userType === "artisan") {
                            document.getElementById("shopName").value = data.shopName || '';
                            document.getElementById("craftType").value = data.craftType || '';
                            
                            if (data.portfolioImages && Array.isArray(data.portfolioImages)) {
                                selectedImages = data.portfolioImages;
                                renderPreviews();
                            }
                        }
                    }
                })
                .catch((error) => {
                    console.error("Error loading profile:", error);
                });
        }

        // Upload images to Firebase Storage with progress tracking
        async function uploadImagesToStorage(userId) {
            const imageUrls = [];
            
            if (!selectedImages || selectedImages.length === 0) {
                return imageUrls;
            }
            
            try {
                // Show progress container
                uploadProgress.style.display = "block";
                
                for (let i = 0; i < selectedImages.length; i++) {
                    const imageObj = selectedImages[i];
                    
                    // Skip if it's already a URL string from previous upload
                    if (typeof imageObj === 'string') {
                        imageUrls.push(imageObj);
                        // Update progress
                        const progress = ((i + 1) / selectedImages.length) * 100;
                        uploadProgressBar.style.width = `${progress}%`;
                        continue;
                    }
                    
                    // Convert data URL to blob
                    const response = await fetch(imageObj.dataUrl);
                    const blob = await response.blob();
                    
                    // Generate a unique filename
                    const extension = imageObj.name ? imageObj.name.split('.').pop() : 'jpg';
                    const filename = `${userId}_${Date.now()}_${i}.${extension}`;
                    const storageRef = storage.ref(`portfolioImages/${userId}/${filename}`);
                    
                    // Create upload task
                    const uploadTask = storageRef.put(blob);
                    
                    // Listen for state changes and progress
                    await new Promise((resolve, reject) => {
                        uploadTask.on('state_changed', 
                            (snapshot) => {
                                // Track upload progress
                                const individualProgress = (snapshot.bytesTransferred / snapshot.totalBytes);
                                const overallProgress = ((i + individualProgress) / selectedImages.length) * 100;
                                uploadProgressBar.style.width = `${overallProgress}%`;
                            },
                            (error) => {
                                // Handle error
                                reject(error);
                            },
                            async () => {
                                // Upload completed successfully
                                const downloadUrl = await uploadTask.snapshot.ref.getDownloadURL();
                                imageUrls.push(downloadUrl);
                                resolve();
                            }
                        );
                    });
                }
                
                // Hide progress container after completion
                setTimeout(() => {
                    uploadProgress.style.display = "none";
                    uploadProgressBar.style.width = "0%";
                }, 1000);
                
                return imageUrls;
            } catch (error) {
                console.error("Error uploading images:", error);
                uploadProgress.style.display = "none";
                throw error;
            }
        }

        // Create account and save profile function
        signupButton.addEventListener("click", async function() {
            // Disable the button and show spinner
            signupButton.disabled = true;
            authSpinner.style.display = "inline-block";
            
            const email = document.getElementById("signupEmail").value.trim();
            const password = document.getElementById("signupPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            
            // Get the rest of the form data
            const name = document.getElementById("name").value.trim();
            const location = getFinalLocation();
            
            // Clear previous messages
            authMessage.textContent = "";
            authMessage.className = "error-message";
            
            // Validate auth input
            if (!email || !password) {
                authMessage.textContent = "Please enter both email and password";
                signupButton.disabled = false;
                authSpinner.style.display = "none";
                return;
            }
            
            // Validate email format
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                authMessage.textContent = "Please enter a valid email address";
                signupButton.disabled = false;
                authSpinner.style.display = "none";
                return;
            }
            
            if (password !== confirmPassword) {
                authMessage.textContent = "Passwords do not match";
                signupButton.disabled = false;
                authSpinner.style.display = "none";
                return;
            }
            
            if (password.length < 6) {
                authMessage.textContent = "Password should be at least 6 characters";
                signupButton.disabled = false;
                authSpinner.style.display = "none";
                return;
            }
            
            // Validate profile data
            if (!name || !location) {
                authMessage.textContent = "Please fill in name and location";
                signupButton.disabled = false;
                authSpinner.style.display = "none";
                return;
            }
            
            // Validate artisan fields if applicable
            if (isArtisan) {
                const shopName = document.getElementById("shopName").value.trim();
                const craftType = document.getElementById("craftType").value.trim();
                
                if (!shopName || !craftType) {
                    authMessage.textContent = "Please complete all artisan details";
                    signupButton.disabled = false;
                    authSpinner.style.display = "none";
                    return;
                }
            }
            
            try {
                // Create user account
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                userCreated = true;
                
                console.log("Account created successfully for:", email);
                
                // Prepare profile data
                const profileData = {
                    userId: user.uid,
                    email: user.email,
                    name: name,
                    location: location,
                    userType: isArtisan ? "artisan" : "regular",
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };
                
                // Add artisan-specific fields if applicable
                if (isArtisan) {
                    const shopName = document.getElementById("shopName").value.trim();
                    const craftType = document.getElementById("craftType").value.trim();
                    
                    profileData.shopName = shopName;
                    profileData.craftType = craftType;
                    
                    // Upload portfolio images if any
                    if (selectedImages.length > 0) {
                        try {
                            const imageUrls = await uploadImagesToStorage(user.uid);
                            profileData.portfolioImages = imageUrls;
                        } catch (error) {
                            console.error("Error uploading images:", error);
                            authMessage.textContent = "Error uploading images. Please try again.";
                            signupButton.disabled = false;
                            authSpinner.style.display = "none";
                            return;
                        }
                    }
                }
                
                // Save profile data to Firestore
                await db.collection("userProfiles").doc(user.uid).set(profileData);
                
                authMessage.textContent = "Account created and profile saved successfully!";
                authMessage.className = "success-message";
                
                // Redirect based on user type
                setTimeout(() => {
                    if (isArtisan) {
                        window.location.href = "artisans-near.html";
                    } else {
                        window.location.href = "index.html";
                    }
                }, 1500);
                
            } catch (error) {
                console.error("Error:", error);
                let errorMessage = error.message;
                
                // Simplify Firebase error messages
                if (errorMessage.includes("email-already-in-use")) {
                    errorMessage = "This email is already registered. Please use a different email or try logging in.";
                } else if (errorMessage.includes("network-request-failed")) {
                    errorMessage = "Network error. Please check your internet connection and try again.";
                }
                
                authMessage.textContent = errorMessage;
                authMessage.className = "error-message";
            } finally {
                // Re-enable the button and hide spinner
                signupButton.disabled = false;
                authSpinner.style.display = "none";
            }
        });

        // Clear profile function
        clearProfileBtn.addEventListener("click", function() {
            // Clear auth fields
            document.getElementById("signupEmail").value = '';
            document.getElementById("signupPassword").value = '';
            document.getElementById("confirmPassword").value = '';
            
            // Clear personal info fields
            document.getElementById("name").value = '';
            locationSelect.value = '';
            customLocation.value = '';
            customLocation.style.display = 'none';
            
            // Clear artisan fields
            document.getElementById("shopName").value = '';
            document.getElementById("craftType").value = '';
            selectedImages = [];
            renderPreviews();
            
            // Clear messages
            authMessage.textContent = "";
        });

        // Set initial visibility for artisan fields
        artisanFields.style.display = isArtisan ? "block" : "none";

        console.log("All event listeners attached successfully");
    } catch (error) {
        console.error("Error initializing Firebase:", error);
        alert("Failed to initialize application. Please check your internet connection and try again.");
    }
});
</script>
</body>
</html>
