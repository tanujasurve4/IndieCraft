<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndieCrafts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #c2a37d;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            background: #f3e2c5;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #5a3d2b;
        }
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f3e2c5;
            padding: 5px 25px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }
        nav ul li a {
            text-decoration: none;
            color: #5a3d2b;
            font-size: 18px;
            font-weight: bold;
        }
        .hero {
            position: relative;
            height: 400px;
            background: url('https://i.pinimg.com/originals/bd/3b/3f/bd3b3ff5565be74a9c8bba681dde7fdd.gif') no-repeat center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .hero::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
        }
        .hero h1 {
            position: relative;
            background: white;
            padding: 10px 20px;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
        }
        .about {
            text-align: center;
            padding: 50px;
            background: #f0e0d6;
            color: #2e1d0e;
        }
        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 50px;
            flex-wrap: wrap;
        }
        .product-card {
            background: #f3e2c5;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            text-align: center;
            width: 250px;
            border-radius: 10px;
        }
        .product-card img {
            width: 100%;
            border-radius: 10px;
        }
        .footer {
            background: #5a3d2b;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            position: relative;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        .login-btn {
            background: white;
            color: #5a3d2b;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            display: inline-block;
        }
        .login-btn:hover {
            background: #f3e2c5;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">IndieCrafts</div>
        <nav>
            <ul>
                <li><a href="homepage.html">EXPLORE</a></li>
                <li><a href="sellproduct.html">SELL</a></li>
            </ul>
        </nav>
    </header>
    <section class="hero">
        <h1>WELCOME TO INDIECRAFTS</h1>
    </section>
    
    <section class="about">
        <h2>About Us</h2>
        <p>IndieCrafts brings you the finest handmade baskets crafted with love and tradition. Supporting artisans worldwide.</p>
    </section>
    
    <footer class="footer">
        <a href="signup.html" class="login-btn">Sign Up</a>
        <a href="login.html" class="login-btn">Login</a>
    </footer>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let userName = localStorage.getItem("userName");
            if (userName) {
                document.getElementById("welcomeMessage").textContent = "Hello, " + userName + "!";
            }
        });
    </script>
</body>
</html>
