<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | IndieCrafts</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: #c2a37d;
            color: #2e1d0e;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f3e2c5;
            padding: 15px 30px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }
        .nav-links a {
            text-decoration: none;
            color: #5a3d2b;
            margin: 0 15px;
            font-weight: bold;
        }
        .container {
            background: #f3e2c5;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin: 100px auto;
        }
        h2 {
            margin-bottom: 20px;
            color: #2e1d0e;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #a67c52;
            border-radius: 8px;
            outline: none;
            background: #f0e0d6;
        }
        .password-container {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #5a3d2b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background: #8a5a44;
        }
        .options {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-top: 10px;
        }
        .navbar {   
          display: flex;
          align-items: center;
          justify-content: space-between;
          background: #f3e2c5;
          padding: 15px 30px;
          box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #5a3d2b;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .nav-links li {
            display: inline;
        }

        .nav-links a {
            text-decoration: none;
            color: #5a3d2b;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #774936;
        }
        
        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 5px;
        }
        
        .signup-link {
            margin-top: 20px;
            text-align: center;
        }
        
        .signup-link a {
            color: #774936;
            text-decoration: none;
            font-weight: bold;
        }
        
        .signup-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <h2>Login</h2>
        <input type="email" placeholder="Email" required id="email">
        <div class="password-container">
            <input type="password" placeholder="Password" id="password" required>
            <span class="toggle-password" onclick="togglePassword()">👁</span>
        </div>
        <div class="options">
            <label style="display: flex; align-items: center;">
                <input type="checkbox" style="margin-right: 5px; width: auto;" id="rememberMe"> Remember me
            </label>
            <a href="#" id="forgotPassword">Forgot Password?</a>
        </div>
        <div id="errorMessage" class="error-message"></div>
        <button class="submit-btn" id="loginButton">Log In</button>
        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>
    
    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA6kw7myRgebBFJY01ccjlYC7IVfesUzm0",
            authDomain: "techproject-f749d.firebaseapp.com", 
            projectId: "techproject-f749d",
            storageBucket: "techproject-f749d.appspot.com",
            messagingSenderId: "318910876949",
            appId: "1:123456789:web:a1b2c3d4e5f6"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const loginButton = document.getElementById('loginButton');
        const errorMessage = document.getElementById('errorMessage');
        const forgotPasswordLink = document.getElementById('forgotPassword');
        
        // Modified: Only redirect if user is authenticated AND page is loaded for more than 2 seconds
        // This prevents immediate redirection when quickly checking auth status
        let pageLoaded = false;
        setTimeout(() => {
            pageLoaded = true;
        }, 2000);
        
        auth.onAuthStateChanged(user => {
            if (user && pageLoaded) {
                // User is already signed in and page has been loaded for enough time
                window.location.href = "homepage.html";
            }
        });
        
        function togglePassword() {
            var passwordField = document.getElementById("password");
            passwordField.type = passwordField.type === "password" ? "text" : "password";
        }

        loginButton.addEventListener('click', function(event) {
            event.preventDefault();
            
            // Get email and password
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            // Validate input
            if (!email || !password) {
                errorMessage.textContent = "Please enter both email and password";
                return;
            }
            
            // Set persistence based on "Remember me" checkbox
            const persistence = rememberMe 
                ? firebase.auth.Auth.Persistence.LOCAL 
                : firebase.auth.Auth.Persistence.SESSION;
            
            // Set persistence first
            auth.setPersistence(persistence)
                .then(() => {
                    // Then sign in the user
                    return auth.signInWithEmailAndPassword(email, password);
                })
                .then((userCredential) => {
                    // Login successful
                    window.location.href = "homepage.html";
                })
                .catch((error) => {
                    // Handle login errors
                    if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                        errorMessage.textContent = "Invalid email or password";
                    } else {
                        errorMessage.textContent = error.message;
                    }
                });
        });
        
        // Forgot password functionality
        forgotPasswordLink.addEventListener('click', function(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                errorMessage.textContent = "Please enter your email address";
                return;
            }
            
            auth.sendPasswordResetEmail(email)
                .then(() => {
                    alert("Password reset email sent! Please check your inbox.");
                })
                .catch((error) => {
                    errorMessage.textContent = error.message;
                });
        });
    </script>
</body>
</html>
