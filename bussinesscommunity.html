<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Business Community</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: #c2a37d;
      color: #2e1d0e;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f3e2c5;
      padding: 15px 30px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    .nav-links li {
      display: inline;
    }

    .nav-links a {
      text-decoration: none;
      color: #5a3d2b;
      font-weight: 600;
    }

    .search-container {
      display: flex;
      align-items: center;
      background: #fff;
      padding: 5px 10px;
      border-radius: 10px;
    }

    .search-container input {
      border: none;
      background: transparent;
      font-size: 16px;
      padding: 5px;
      outline: none;
    }

    .search-container button {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: #5a3d2b;
    }

    .community {
      text-align: center;
      margin: 30px;
    }

    .community h2 {
      font-size: 24px;
      font-weight: bold;
      color: white;
      background: #5a3d2b;
      padding: 10px 20px;
      border-radius: 10px;
      display: inline-block;
    }

    .square-container {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .square-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .square {
      width: 300px;
      height: 250px;
      background-color: #f3e2c5;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease-in-out;
      text-align: center;
      padding-bottom: 10px;
    }

    .square:hover {
      transform: scale(1.05);
    }

    .square img {
      width: 100%;
      height: 75%;
      object-fit: cover;
      border-radius: 10px 10px 0 0;
    }

    .category-btn {
      background: #5a3d2b;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 5px;
      transition: background 0.3s;
    }

    .category-btn:hover {
      background: #3f2a1b;
    }

    .description-box {
      display: none;
      background: #fff;
      color: #4e3729;
      font-size: 13px;
      font-style: italic;
      padding: 10px;
      margin-top: 8px;
      border-radius: 8px;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
      width: 280px;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    .square-wrapper:hover .description-box {
      display: block;
      opacity: 1;
    }

    @media (max-width: 768px) {
      .square-container {
        flex-direction: column;
        align-items: center;
      }

      .square {
        width: 90%;
        height: auto;
      }

      .description-box {
        width: 90%;
        text-align: center;
      }
    }
    .navbar {   
          display: flex;
          align-items: center;
          justify-content: space-between;
          background: #f3e2c5;
          padding: 15px 30px;
          box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
      }

      .logo {
          font-size: 24px;
          font-weight: bold;
          color: #5a3d2b;
      }

      .nav-links {
          list-style: none;
          display: flex;
          gap: 20px;
          margin: 0;
          padding: 0;
      }

      .nav-links li {
          display: inline;
      }

      .nav-links a {
          text-decoration: none;
          color: #5a3d2b;
          font-weight: 600;
          transition: color 0.3s ease;
      }

      .nav-links a:hover {
          color: #774936;
      }

      .search-container {
          display: flex;
          align-items: center;
          background: #fff;
          padding: 5px 10px;
          border-radius: 10px;
      }

      .search-container input {
          border: none;
          background: transparent;
          font-size: 16px;
          padding: 5px;
          outline: none;
      }

      .search-container button {
          background: transparent;
          border: none;
          cursor: pointer;
          font-size: 18px;
          color: #5a3d2b;
      }

  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">
        IndieCrafts              
    </div>
    <h2 id="welcomeMessage"></h2>
    <ul class="nav-links">
        <li><a href="homepage.html">Home</a></li>
        <li><a href="explorelist.html">Shop Now</a></li>
    </ul>
    <div class="search-container">
        <input type="text" placeholder="Search Handicrafts...">
        <button>&#128269;</button>
    </div>
  </nav>
  <section class="community">
    <h2>BUSINESS COMMUNITY</h2>
    <div class="square-container">

      <div class="square-wrapper">
        <div class="square">
          <img src="https://media.licdn.com/dms/image/v2/D5612AQGy-MNpml9r2w/article-cover_image-shrink_600_2000/article-cover_image-shrink_600_2000/0/1689236191195?e=2147483647&v=beta&t=DEuU36ICUed2gI-R8G8CWlhVfgXyfmS4eA2b6x_Cjn4" alt="Success Stories">
          <button class="category-btn" onclick="window.location.href='artistnear.html'">ARTIST NEAR YOU</button>
        </div>
        <div class="description-box">Connect with local artists around you and discover traditional talents.</div>
      </div>

      <div class="square-wrapper">
        <div class="square">
          <img src="https://i.pinimg.com/736x/db/36/0d/db360dacbe66bd9e774b9a0fbba5b0ca.jpg" alt="Government Schemes">
          <button class="category-btn" onclick="window.location.href='govscheme.html'">GOVERNMENT SCHEMES AND RESOURCES</button>
        </div>
        <div class="description-box">Explore government schemes and resources for artisans.</div>
      </div>

      <div class="square-wrapper">
        <div class="square">
          <img src="https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcTRE-fCXvoPJ3HWEDuihl9M4piJDbxrLl-PvJyJSZ9SpXxzbCdP" alt="Success Stories">
          <button class="category-btn" onclick="window.location.href='successstories.html'">SUCCESS STORIES AND TESTIMONIALS</button>
        </div>
        <div class="description-box">Read inspiring success stories and testimonials from small businesses.</div>
      </div>

    </div>
  </section>
</body>
</html>
