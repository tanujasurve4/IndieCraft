<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artists Near You</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

    body {
        font-family: 'Poppins', sans-serif;
        margin: 0;
        padding: 0;
        background: #c2a37d;
        color: #2e1d0e;
        text-align: center;
    }

    .banner {
        background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('background-image.jpg') no-repeat center center/cover;
        padding: 60px 20px;
        color: white;
        font-size: 32px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .location-container {
        margin: 20px auto;
        font-size: 18px;
    }

    #location {
        padding: 12px;
        font-size: 16px;
        border-radius: 10px;
        border: none;
        background: #fff;
        outline: none;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    #location:hover {
        background: #e0d4b7;
    }

    .artists-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        padding: 20px;
        max-width: 1000px;
        margin: auto;
    }

    .artist-card {
        display: flex;
        flex-direction: column;
        background: #f3e2c5;
        border: 2px solid #e4d1ae;
        border-radius: 12px;
        padding: 20px;
        align-items: center;
        box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .artist-card:hover {
        transform: scale(1.05);
        box-shadow: 8px 8px 20px rgba(0, 0, 0, 0.3);
    }

    .artist-info {
        text-align: center;
        font-size: 16px;
        font-weight: 400;
    }

    .artist-info strong {
        font-weight: 600;
    }

    .see-portfolio {
        background-color: #2e1d0e !important;
        color: white !important;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }
    .see-portfolio:hover {
        background-color: #513321 !important;
    }

    .portfolio-popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
        z-index: 1000;
        max-width: 90vw;
        max-height: 90vh;
        overflow-y: auto;
        animation: fadeInScale 0.3s ease-in-out;
    }

    @keyframes fadeInScale {
        from {
            opacity: 0;
            transform: scale(0.9) translate(-50%, -50%);
        }
        to {
            opacity: 1;
            transform: scale(1) translate(-50%, -50%);
        }
    }

    .portfolio-images {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .portfolio-images img {
        width: 200px;
        height: 200px;
        object-fit: cover;
        border-radius: 8px;
    }

    .close-btn {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 20px;
        cursor: pointer;
        color: #774936;
    }

    .portfolio-btn {
        background-color: #2e1d0e;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }
    .portfolio-btn:hover {
        background-color: #513321;
    }

    .loading-spinner {
        margin: 40px auto;
        width: 50px;
        height: 50px;
        border: 5px solid #f3e2c5;
        border-radius: 50%;
        border-top: 5px solid #774936;
        animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    
    .no-artists {
        margin: 40px auto;
        padding: 20px;
        background: #f3e2c5;
        border-radius: 12px;
        max-width: 500px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    @media (max-width: 768px) {
        .artists-container {
            grid-template-columns: 1fr;
        }
    }
    .artist-card {
        box-sizing: border-box;
        width: 100%;
        max-width: 100%;
    }
    .navbar {   
    display: flex;
          align-items: center;
          justify-content: space-between;
          background: #f3e2c5;
          padding: 15px 30px;
          box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
      }

      .logo {
          font-size: 24px;
          font-weight: bold;
          color: #5a3d2b;
      }

      .nav-links {
          list-style: none;
          display: flex;
          gap: 20px;
          margin: 0;
          padding: 0;
      }

      .nav-links li {
          display: inline;
      }

      .nav-links a {
          text-decoration: none;
          color: #5a3d2b;
          font-weight: 600;
          transition: color 0.3s ease;
      }

      .nav-links a:hover {
          color: #774936;
      }

      .search-container {
          display: flex;
          align-items: center;
          background: #fff;
          padding: 5px 10px;
          border-radius: 10px;
      }

      .search-container input {
          border: none;
          background: transparent;
          font-size: 16px;
          padding: 5px;
          outline: none;
      }

      .search-container button {
          background: transparent;
          border: none;
          cursor: pointer;
          font-size: 18px;
          color: #5a3d2b;
      }
  </style>
</head>

            { name: 'Divya Nair', shop: 'Art & Soul', email:'divyanair90@gmail.com', art: 'Folk Art', images: ['https://thesstudioonline.com/cdn/shop/files/ss1055-3-66c97c2ad847f_84bbc19d-9fd9-4df1-92e8-08116d468321.webp?v=1724482051&width=630', 'https://i.pinimg.com/736x/be/62/34/be623483e442421b22a94d5c8423a675.jpg', 'https://i.etsystatic.com/19060240/r/il/cc6d24/6220729949/il_570xN.6220729949_8eug.jpg'] },

            // Check authentication state
            auth.onAuthStateChanged(user => {
                if (user) {
                    console.log("User is signed in:", user.email);
                    // Display welcome message
                    fetchUserName(user.uid);
                } else {
                    console.log("No user is signed in");
                    document.getElementById("welcomeMessage").textContent = "Welcome, Guest";
                }
                
                // Load artists data regardless of auth state
                loadArtistsData();
            });
            
            // Fetch user's name for welcome message
            function fetchUserName(userId) {
                db.collection("userProfiles").doc(userId).get()
                    .then((doc) => {
                        if (doc.exists && doc.data().name) {
                            document.getElementById("welcomeMessage").textContent = `Welcome, ${doc.data().name}`;
                        } else {
                            document.getElementById("welcomeMessage").textContent = "Welcome!";
                        }
                    })
                    .catch((error) => {
                        console.error("Error fetching user data:", error);
                    });
            }
            
            // Load artists data from Firestore
            function loadArtistsData() {
                // Show loading spinner
                artistsContainer.innerHTML = '<div class="loading-spinner"></div>';
                
                // Get all documents from artistsByLocation collection
                db.collection("artistsByLocation").get()
                    .then((querySnapshot) => {
                        querySnapshot.forEach((doc) => {
                            const locationData = doc.data();
                            const locationName = locationData.location;
                            
                            // Store artists for this location
                            artistsByLocation[locationName] = locationData.artists || [];
                            
                            // Add location to dropdown if not already there
                            if (![...locationSelect.options].some(opt => opt.value === locationName)) {
                                const option = document.createElement("option");
                                option.value = locationName;
                                option.textContent = locationName;
                                locationSelect.appendChild(option);
                            }
                        });
                        
                        // Update the display after loading data
                        updateArtistsDisplay();
                    })
                    .catch((error) => {
                        console.error("Error loading artists data:", error);
                        artistsContainer.innerHTML = '<div class="no-artists">Error loading artists. Please try again later.</div>';
                    });
            }
            
            // Update artists display based on selected location
            function updateArtistsDisplay() {
                const selectedLocation = locationSelect.value;
                artistsContainer.innerHTML = "";
                
                const locations = selectedLocation === "All" 
                    ? Object.keys(artistsByLocation) 
                    : [selectedLocation];
                
                let artistsFound = false;
                
                locations.forEach(location => {
                    if (artistsByLocation[location] && artistsByLocation[location].length > 0) {
                        artistsByLocation[location].forEach(artist => {
                            artistsFound = true;
                            createArtistCard(artist, location);
                        });
                    }
                });
                
                // Show message if no artists found
                if (!artistsFound) {
                    artistsContainer.innerHTML = '<div class="no-artists">No artists found for the selected location.</div>';
                }
            }
            
            // Create artist card element
            function createArtistCard(artist, location) {
                const card = document.createElement("div");
                card.className = "artist-card";
                
                const artistInfo = document.createElement("div");
                artistInfo.className = "artist-info";
                
                // Create artist information elements
                const nameElement = document.createElement("p");
                nameElement.innerHTML = `<strong>Artist Name:</strong> ${artist.name || "N/A"}`;
                
                const shopElement = document.createElement("p");
                shopElement.innerHTML = `<strong>Shop Name:</strong> ${artist.shop || "N/A"}`;
                
                const emailElement = document.createElement("p");
                emailElement.innerHTML = `<strong>Email:</strong> ${artist.email || "N/A"}`;
                
                const artElement = document.createElement("p");
                artElement.innerHTML = `<strong>Art Type:</strong> ${artist.art || "N/A"}`;
                
                const locationElement = document.createElement("p");
                locationElement.innerHTML = `<strong>Location:</strong> ${location}`;
                
                // Create portfolio button
                const portfolioButton = document.createElement("button");
                portfolioButton.className = "see-portfolio";
                portfolioButton.textContent = "See Portfolio";
                portfolioButton.addEventListener("click", () => showPortfolio(artist));
                
                // Append all elements to info div
                artistInfo.appendChild(nameElement);
                artistInfo.appendChild(shopElement);
                artistInfo.appendChild(emailElement);
                artistInfo.appendChild(artElement);
                artistInfo.appendChild(locationElement);
                artistInfo.appendChild(portfolioButton);
                
                // Append info div to card
                card.appendChild(artistInfo);
                
                // Add card to container
                artistsContainer.appendChild(card);
            }
            
            // Show portfolio popup
            function showPortfolio(artist) {
                const popupTitle = document.getElementById("popupTitle");
                const popupImages = document.getElementById("popupImages");
                const portfolioPopup = document.getElementById("portfolioPopup");
                
                // Set title
                popupTitle.textContent = `${artist.name}'s Portfolio`;
                
                // Clear previous images
                popupImages.innerHTML = "";
                
                // Check if artist has images
                if (artist.images && artist.images.length > 0) {
                    // Add each image to the popup
                    artist.images.forEach(imageUrl => {
                        const img = document.createElement("img");
                        img.src = imageUrl;
                        img.alt = `${artist.name}'s work`;
                        img.onerror = function() {
                            this.src = 'placeholder-image.jpg';
                            this.alt = 'Image not available';
                        };
                        popupImages.appendChild(img);
                    });
                } else {
                    // No images message
                    popupImages.innerHTML = "<p>No portfolio images available.</p>";
                }
                
                // Show popup
                portfolioPopup.style.display = "block";
            }
            
            // Listen for location selection change
            locationSelect.addEventListener("change", updateArtistsDisplay);
            
            // Close portfolio popup when clicking outside
            window.addEventListener("click", function(event) {
                const popup = document.getElementById("portfolioPopup");
                if (event.target === popup) {
                    popup.style.display = "none";
                }
            });
        } catch (error) {
            console.error("Firebase initialization error:", error);
            document.querySelector(".artists-container").innerHTML = 
                '<div class="no-artists">Error initializing application. Please try again later.</div>';
        }
    });
</script>
